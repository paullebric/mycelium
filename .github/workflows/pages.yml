# Construit la version web (PWA) et la publie sur GitHub Pages à chaque envoi sur main.
name: Publier la PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier les données
        run: node verifier.js
      - name: Construire la PWA
        run: node build.js --pwa
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pwa
  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
